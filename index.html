    <div class="card">${profileFormHTML(S.profile)}</div>
    <button class="btn" data-onb="program" style="margin-top:16px">Tiếp: chọn giáo án ›</button>
    <div class="pair" style="margin-top:10px">
      <button class="ghost" data-onb="welcome">‹ Quay lại</button>
      <button class="ghost" data-onb="program">Bỏ qua</button></div>`;
  if (onbStep === "program") return `
    <div class="tiny dim" style="margin-top:4px">Bước 2 / 2</div>
    <h2>Chọn giáo án</h2>
    <div class="sub">Chọn theo số buổi bạn thật sự đi được mỗi tuần — kết quả tăng cơ gần như nhau nếu đủ số set. Đổi lại được bất cứ lúc nào ở tab Tôi, nhật ký vẫn giữ.</div>
    <div class="stack">${tplCards(true)}</div>
    <button class="ghost" data-onb="profile" style="margin-top:16px;width:100%">‹ Quay lại</button>`;
  return `
    <div style="text-align:center;padding:28px 0 8px">
      <img src="./favicon.svg" alt="" width="88" height="88" style="border-radius:22px">
      <h2 style="margin:18px 0 6px">Chào mừng tới Gym <span style="color:var(--brass)">Book</span></h2>
      <p class="muted" style="margin:0 auto;max-width:320px">Ghi từng set, tự gợi ý tạ, đếm giờ nghỉ. Dữ liệu chỉ nằm trên máy bạn.</p>
    </div>
    <div class="stack" style="margin-top:24px">
      <button class="btn" data-onb="profile">Bắt đầu mới</button>
      <button class="ghost" id="importBtn">⬆ Nhập dữ liệu cũ (file JSON)</button>
      ${importInput()}
    </div>
    <p class="small dim" style="margin-top:14px;text-align:center">Đã dùng Gym Book ở máy khác hoặc trên trình duyệt?
      Mở bản đó → tab Tôi → Dữ liệu → Xuất file JSON, rồi nhập file ở đây.</p>`;
}

/* ---------------- render ---------------- */
let lastTab = null;
function render() {
  if (!S.setupDone) tab = "setup";
  document.body.classList.toggle("onb", tab === "setup");
  if (!curDay || !S.days.some(d => d.id === curDay)) curDay = autoDay();
  if (S.hideOpt && (day().exercises[exIdx] || {}).opt) exIdx = firstUnfinished();
  renderTop();
  // vẽ lại tab Tôi (thêm bài, thêm bài thay thế…) không được gập mục người dùng đang mở
  const wasOpen = tab === "me" && lastTab === "me"
    ? [...document.querySelectorAll("#view details")].map(x => x.open) : null;
  $("#view").innerHTML = tab === "setup" ? viewSetup() : tab === "train" ? viewTrain() : tab === "an" ? viewFood()
    : tab === "history" ? viewHistory() : viewMe();
  if (wasOpen) document.querySelectorAll("#view details").forEach((x, i) => { if (i < wasOpen.length) x.open = wasOpen[i]; });
  lastTab = tab;
  syncWake();
  document.querySelectorAll(".tab").forEach(b =>
    b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
}

/* ---------------- đồng hồ nghỉ ---------------- */
let audioCtx = null;
function ensureAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) { /* không có audio */ }
}
function buzz() {
  try { if (navigator.vibrate) navigator.vibrate([220, 90, 220]); } catch (e) {}
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime;
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.start(t0); o.stop(t0 + 0.6);
  } catch (e) { /* trình duyệt chặn âm thanh */ }
}
function startRest(sec) {
  if (!sec || sec <= 0) { render(); return; }
  restEnd = Date.now() + sec * 1000;
  render();
  clearInterval(restTimer);
  restTimer = setInterval(() => {
    const left = Math.ceil((restEnd - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(restTimer); restTimer = null; restEnd = 0; buzz(); restNotify();
      // đang sửa set thì không vẽ lại (mất số đang gõ) — chỉ đổi dòng đếm ngược
      if (editIdx != null) { const m = $(".restmini"); if (m) m.textContent = "Hết giờ nghỉ"; }
      else render();
      return;
    }
    const el = $("#restNum"); if (el) el.textContent = mmss(left);
  }, 250);
}
function stopRest() { clearInterval(restTimer); restTimer = null; restEnd = 0; restNotify(); render(); }

function firstUnfinished() {
  const d = day(), vis = visible(d);
  for (const i of vis) if (rested(curDate, d.id, d.exercises[i]) < d.exercises[i].sets) return i;
  return vis.length ? vis[0] : 0;
}
/** Bài chưa xong kế tiếp sau bài i (vòng lại từ đầu), bỏ qua bài đã xong; không còn thì null. */
function nextUnfinished(i) {
  const d = day(), vis = visible(d), pos = vis.indexOf(i);
  const order = vis.slice(pos + 1).concat(vis.slice(0, Math.max(pos, 0)));
  return order.find(j => rested(curDate, d.id, d.exercises[j]) < d.exercises[j].sets) ?? null;
}

/* ---------------- sự kiện ---------------- */
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => {
    if (b.dataset.tab === "an" && tab !== "an") { foodDate = today(); foodSel = null; favEdit = false; }
    tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  if (tab === "an" && foodClick(el)) return;

  if (el.dataset.goto) { tab = el.dataset.goto; render(); window.scrollTo(0, 0); return; }
  if (el.id === "pickerBtn") { showPicker = !showPicker; render(); return; }
  if (el.id === "optToggle") {
    S.hideOpt = !S.hideOpt; editIdx = null; save(true); render();
    toast(S.hideOpt ? "Đã ẩn bài phụ" : "Hiện lại bài phụ"); return;
  }

  if (el.dataset.jump !== undefined) {
    const i = +el.dataset.jump, d = day();
    if (i < 0 || i >= d.exercises.length) return;
    exIdx = i; editIdx = null; render(); window.scrollTo(0, 0); return;
  }
  if (el.dataset.day) {
    curDay = el.dataset.day; exIdx = firstUnfinished(); editIdx = null; showPicker = false; render(); return;
  }
  if (el.dataset.alt !== undefined) {
    const d = day(), k = lkey(curDate, d.id, d.exercises[exIdx].id), want = el.dataset.alt;
    if ((S.swap[k] || "") === want) return;
    if ((S.log[k] || []).length) { toast("Xoá các set đã ghi rồi mới đổi"); return; }
    if (want) S.swap[k] = want; else delete S.swap[k];
    editIdx = null; save(true); render(); return;
  }
  if (el.dataset.delset !== undefined) {
    const i = +el.dataset.delset, d = day(), k = lkey(curDate, d.id, d.exercises[exIdx].id);
    const arr = S.log[k];
    if (!arr || !arr[i]) return;
    const gone = arr[i];
    arr.splice(i, 1);                       // các set sau tự dồn số lại
    if (!arr.length) delete S.log[k];       // xoá hẳn khoá để buổi rỗng không vào nhật ký
    editIdx = null;
    save(true);
    stopRest();                             // set không tính thì cũng không phải nghỉ
    toast(`Đã xoá set ${i + 1} · ${gone.kg}×${gone.reps}`);
    return;
  }
  if (el.dataset.skip) {
    const d = day(), ex = d.exercises[exIdx], k = lkey(curDate, d.id, ex.id);
    const left = (+ex.sets || 1) - rested(curDate, d.id, ex);
    if (left <= 0) return;
    const n = el.dataset.skip === "rest" ? left : 1;
    S.skip[k] = skipped(curDate, d.id, ex.id) + n;
    editIdx = null; save(true);
    // bài vừa xong vì bỏ qua: sang bài chưa tập kế tiếp. Ở lại khi đã xong hết (màn Xong buổi)
    // hoặc vừa xong hết bài chính mà còn bài phụ (màn hỏi làm bài phụ hay về).
    const pr = progress(), optLeft = d.exercises.some(e => e.opt && rested(curDate, d.id, e) < e.sets);
    const nx = rested(curDate, d.id, ex) >= ex.sets ? nextUnfinished(exIdx) : null;
    if (nx != null && !(!ex.opt && !S.hideOpt && optLeft && pr.mainDone >= pr.mainTotal)) { exIdx = nx; window.scrollTo(0, 0); }
    stopRest();
    toast(n > 1 ? `Đã bỏ qua ${n} set còn lại` : "Đã bỏ qua 1 set");
    return;
  }
  if (el.dataset.unskip) {
    delete S.skip[lkey(curDate, day().id, day().exercises[exIdx].id)];
    save(true); render(); toast("Đã hoàn lại"); return;
  }
  if (el.dataset.edit !== undefined) {
    // sửa set cũ không dừng đồng hồ nghỉ: vẫn đếm ở dòng nhỏ trên khung sửa
    editIdx = editIdx === +el.dataset.edit ? null : +el.dataset.edit;
    render(); return;
  }

  if (el.dataset.step) {
    const [f, dir] = el.dataset.step.split(":");
    const ex = eff(day().exercises[exIdx], curDate, day().id);
    const input = $(f === "kg" ? "#kgVal" : "#repVal");
    const step = f === "kg" ? (+ex.step || 2.5) : 1;
    let v = parseFloat(input.value); if (!isFinite(v)) v = 0;
    v = Math.max(0, Math.round((v + step * +dir) / step) * step);
    input.value = f === "kg" ? String(n1(v)) : String(Math.round(v));
    return;
  }
  if (el.id === "logSet") {
    const d = day(), ex = d.exercises[exIdx];
    const kg = $("#kgVal").value.trim(), reps = $("#repVal").value.trim();
    if (reps === "" || +reps <= 0) { toast("Nhập số rep đã"); return; }
    const k = lkey(curDate, d.id, ex.id);
    if (!S.log[k]) S.log[k] = [];
    S.log[k][editIdx != null ? editIdx : S.log[k].length] = { kg: kg === "" ? "0" : kg, reps };
    save(true);
    if (editIdx != null) { editIdx = null; render(); toast("Đã cập nhật"); return; }
    ensureAudio();
    notifSetup();  // hỏi quyền thông báo ngay lần ghi set đầu, lúc người dùng đang cầm máy
    startRest(+ex.rest || 120);
    return;
  }
  if (el.id === "cancelEdit") { editIdx = null; render(); return; }
  if (el.id === "restAdd") { restEnd += 30000; restNotify(); const n = $("#restNum");
    if (n) n.textContent = mmss(Math.ceil((restEnd - Date.now()) / 1000)); return; }
  if (el.id === "restSkip") { stopRest(); return; }

  if (el.id === "bwAdd") {
    const date = $("#bwDate").value, kg = parseFloat($("#bwKg").value);
    if (!date || !isFinite(kg)) { toast("Nhập cân nặng đã"); return; }
    S.bw = S.bw.filter(x => x.date !== date).concat([{ date, kg }]);
    S.profile.weight = kg; save(true); render(); toast("Đã ghi " + n1(kg) + " kg"); return;
  }
  if (el.dataset.delbw) { S.bw = S.bw.filter(x => x.date !== el.dataset.delbw); save(true); render(); return; }

  if (el.id === "addDay") { S.days.push({ id: uid(), name: "Buổi mới", exercises: [] }); save(true); render(); return; }
  if (el.dataset.delday) {
    const d = S.days.find(x => x.id === el.dataset.delday);
    if (S.days.length < 2) { toast("Phải còn ít nhất một buổi"); return; }
    if (d && confirm(`Xoá "${d.name}"?\nNhật ký cũ vẫn giữ nguyên.`)) {
      S.days = S.days.filter(x => x.id !== el.dataset.delday);
      if (curDay === el.dataset.delday) { curDay = S.days[0].id; exIdx = 0; }
      save(true); render();
    } return;
  }
  if (el.dataset.addex) {
    const d = S.days.find(x => x.id === el.dataset.addex);
    if (d) { d.exercises.push({ id: uid(), name: "Bài mới", sets: 3, reps: "8–10",
      unit: "kg", start: 20, step: 2.5, rest: 120, note: "" }); save(true); render(); }
    return;
  }
  if (el.dataset.addalt) {
    const [dayId, exId] = el.dataset.addalt.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (ex) { (ex.alts = ex.alts || []).push({ id: uid(), name: "Bài thay thế", reps: ex.reps,
      unit: ex.unit, start: 0, step: ex.step || 2.5, note: "", fig: "" }); save(true); render(); }
    return;
  }
  if (el.dataset.delalt) {
    const [dayId, exId, altId] = el.dataset.delalt.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    const a = ex && (ex.alts || []).find(x => x.id === altId);
    if (a && confirm(`Xoá bài thay thế "${a.name}"?\nCác set đã ghi vẫn giữ trong nhật ký.`)) {
      ex.alts = ex.alts.filter(x => x.id !== altId); save(true); render();
    } return;
  }
  if (el.dataset.delex) {
    const [dayId, exId] = el.dataset.delex.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (ex && confirm(`Xoá bài "${ex.name}"?`)) {
      d.exercises = d.exercises.filter(x => x.id !== exId);
      if (exIdx >= d.exercises.length) exIdx = 0;
      save(true); render();
    } return;
  }

  if (el.id === "exportBtn" && NATIVE) {
    // WebView không tải file xuống được: ghi vào bộ nhớ tạm rồi mở bảng Chia sẻ (Drive, Zalo, email…)
    const FS = plug("Filesystem"), SH = plug("Share"), name = "gym-book-" + today() + ".json";
    if (!FS || !SH) { toast("Thiếu plugin xuất file"); return; }
    FS.writeFile({ path: name, data: JSON.stringify(S, null, 2), directory: "CACHE", encoding: "utf8" })
      .then(r => SH.share({ title: name, files: [r.uri] }))
      .catch(err => { if (!/cancel/i.test(String(err && err.message))) toast("Không xuất được: " + (err && err.message)); });
    return;
  }
  if (el.id === "exportBtn") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = "gym-book-" + today() + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Đã xuất file"); return;
  }
  if (el.id === "installBtn") {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.finally(() => { installPrompt = null; render(); });
    return;
  }
  if (el.dataset.themePick) {
    S.theme = el.dataset.themePick; save(true); applyTheme(); render();
    toast("Giao diện: " + THEMES.find(x => x[0] === S.theme)[1]); return;
  }
  if (el.dataset.hview) { histView = S.histView = el.dataset.hview; save(true); render(); return; }
  if (el.dataset.pmetric) { progMetric = el.dataset.pmetric; render(); return; }
  if (el.dataset.onb) { onbStep = el.dataset.onb; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.pick) {
    useTemplate(el.dataset.pick); S.setupDone = true; save(true);
    tab = "train"; render(); window.scrollTo(0, 0);
    toast("Bắt đầu với " + tplOf(el.dataset.pick).name); return;
  }
  if (el.dataset.usetpl) {
    const t = tplOf(el.dataset.usetpl);
    if (confirm(`Chuyển sang giáo án "${t.name}" (${t.perText})?\n\nNhật ký, cân nặng và lịch sử tạ vẫn giữ — bài trùng tên gợi ý tạ theo lần tập gần nhất. Chỉnh sửa riêng trong Chương trình của giáo án hiện tại sẽ mất.`)) {
      useTemplate(t.id); save(true); tab = "train"; render(); window.scrollTo(0, 0);
      toast("Đã chuyển sang " + t.name);
    } return;
  }
  if (el.dataset.snapmon) {
    S.profile.startDate = el.dataset.snapmon; save(true); render();
    toast("Tuần giờ bắt đầu từ thứ Hai · đang ở tuần " + weekNo(today())); return;
  }
  if (el.id === "importBtn") { $("#importFile").click(); return; }
  if (el.id === "resetBtn") {
    if (confirm(`Khôi phục giáo án "${tplOf(S.programId).name}" về bản gốc?\nNhật ký và cân nặng vẫn được giữ.`)) {
      useTemplate(S.programId);
      save(true); render(); toast("Đã khôi phục");
    } return;
  }
});

const NUMFIELDS = ["age", "height", "weight", "goalWeight", "activity", "surplus", "proteinPerKg", "fatPerKg", "weeks"];
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "foodQ") { foodQ = el.value; foodSel = null; refreshFoodResults(); return; }
  if (el.id === "foodG") { if (foodSel) { foodSel.g = el.value; refreshSel(); } return; }
  if (el.id === "keepAwake") {
    S.keepAwake = el.checked; save(true); syncWake();
    toast(el.checked ? "Màn hình sẽ sáng khi ở tab Tập" : "Màn hình tự tắt như bình thường"); return;
  }
  if (el.id && el.id.startsWith("p-")) {
    const f = el.id.slice(2);
    S.profile[f] = NUMFIELDS.includes(f) ? (el.value === "" ? "" : +el.value) : el.value;
    save(); return;
  }
  if (el.dataset.dayname) {
    const d = S.days.find(x => x.id === el.dataset.dayname);
    if (d) { d.name = el.value; save(); renderTop(); } return;
  }
  if (el.dataset.ex) {
    const [dayId, exId, field] = el.dataset.ex.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    if (!ex) return;
    ex[field] = field === "opt" ? el.checked
      : ["sets", "start", "step", "rest"].includes(field) ? (+el.value || 0) : el.value;
    if (field === "sets" && ex.sets < 1) ex.sets = 1;
    save(); return;
  }
  if (el.dataset.altf) {
    const [dayId, exId, altId, field] = el.dataset.altf.split("|");
    const d = S.days.find(x => x.id === dayId), ex = d && d.exercises.find(x => x.id === exId);
    const a = ex && (ex.alts || []).find(x => x.id === altId);
    if (!a) return;
    a[field] = ["start", "step"].includes(field) ? (+el.value || 0) : el.value;
    save(); return;
  }
  if (el.id === "dateInput") {
    curDate = el.value || today(); curDay = autoDay(); exIdx = firstUnfinished(); editIdx = null; render();
  }
});

/* Vừa đủ (hoặc vừa thiếu) thông số → vẽ lại tab Tôi ở dạng tương ứng. */
let hadProfile = !!targets();
document.addEventListener("change", e => {
  if (tab === "me" && e.target.id === "p-startDate") { render(); return; }
  if (tab === "me" && e.target.id && e.target.id.startsWith("p-") && !!targets() !== hadProfile) {
    hadProfile = !!targets(); render();
  }
});

document.addEventListener("change", e => { if (e.target.id === "progEx") { progEx = e.target.value; render(); } });
document.addEventListener("change", e => {
  if (e.target.id !== "goalSel") return;
  const g = GOALS.find(x => x[0] === e.target.value); if (!g) return;
  S.profile.surplus = g[2]; save(true); render(); toast("Mục tiêu: " + g[1] + " · chênh " + (g[2] > 0 ? "+" : "") + g[2] + " kcal");
});
document.addEventListener("change", e => {
  if (e.target.id !== "importFile") return;
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !d.profile || !Array.isArray(d.days) || !d.days.length) throw new Error("thiếu trường bắt buộc");
      S = migrate(d); S.setupDone = true; applyTheme(); curDay = autoDay(); exIdx = firstUnfinished(); hadProfile = !!targets();
      if (tab === "setup") tab = "train";
      save(true); render(); toast("Đã nhập dữ liệu");
    } catch (err) { toast("File không đọc được: " + err.message); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ---------------- cài đặt & offline ---------------- */
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installPrompt = e;
  if (tab === "me") render();
});
window.addEventListener("appinstalled", () => { installPrompt = null; if (tab === "me") render(); });
if (!NATIVE && "serviceWorker" in navigator) {
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("./sw.js").catch(() => { /* offline không bắt buộc */ }));
}

/* ---------------- khởi động ---------------- */
applyTheme();
curDay = autoDay();
exIdx = firstUnfinished();
render();
</script>
</body>
</html>
