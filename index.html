<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="description" content="Sổ tập tạ — ghi từng set, đếm giờ nghỉ, theo dõi cân nặng. Dữ liệu nằm trên máy bạn.">
<title>Gym Book</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Book">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- đủ font cho mọi theme; trình duyệt chỉ tải mặt chữ đang dùng -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script>
/* Đặt theme trước khi vẽ để khỏi nháy màu. "auto" theo chế độ sáng/tối của máy. */
(function () {
  var t = "hientai";
  try { t = localStorage.getItem("gymbook.theme") || "hientai"; } catch (e) {}
  if (t === "auto") t = matchMedia("(prefers-color-scheme: light)").matches ? "sang" : "dem";
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root,[data-theme="hientai"]{
  --ground:#0d1014; --surface:#171d22; --raised:#222a31; --line:#2e3841;
  --chalk:#eef0f3; --muted:#96a1ae; --dim:#68737f;
  --brass:#e0a233; --brass-ink:#17120a; --jade:#43c295; --rust:#cf5c43;
  --good-bg:#1d3830; --good-line:#27503f; --good-ink:#08201a; --bad-bg:#3a251f; --bad-line:#4d2c25;
  --press:#c78e29; --press-2:#2d363f; --viz:#c08520; --viz-on:#d69a36;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --caps:uppercase; --trk:1; --r-lg:14px; --r:12px; --r-sm:10px; --shadow:none;
  color-scheme:dark;
}
/* Các theme khác: chỉ đổi biến. --caps/--trk: tiêu đề in hoa + giãn chữ (1) hay chữ thường (0). */
[data-theme="sang"]{
  --ground:#f5f4f0; --surface:#ffffff; --raised:#eeece6; --line:#e2dfd7;
  --chalk:#17160f; --muted:#5f5c54; --dim:#77736a;
  --brass:#d9531c; --brass-ink:#ffffff; --jade:#0e8a5f; --rust:#c2410c;
  --good-bg:#e3f3ec; --good-line:#b7dfcd; --good-ink:#ffffff; --bad-bg:#fbe7df; --bad-line:#f0c2b0;
  --press:#b8440f; --press-2:#e5e2da; --viz:#d9531c; --viz-on:#b8440f;
  --display:"Lexend",system-ui,sans-serif; --body:"Lexend",system-ui,sans-serif;
  --caps:none; --trk:0; --r-lg:22px; --r:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(23,22,15,.06),0 6px 20px rgba(23,22,15,.05);
  color-scheme:light;
}
[data-theme="neon"]{
  --ground:#0a0a0b; --surface:#141416; --raised:#1f1f23; --line:#2a2a2f;
  --chalk:#f4f4f5; --muted:#a1a1aa; --dim:#7b7b84;
  --brass:#c8ff2e; --brass-ink:#0a0a0b; --jade:#4ade80; --rust:#f87171;
  --good-bg:#13261a; --good-line:#1f4a2c; --good-ink:#0a0a0b; --bad-bg:#2a1414; --bad-line:#4a2020;
  --press:#a8d91f; --press-2:#2a2a2f; --viz:#7ea31a; --viz-on:#a6d624;
  --display:"Anton","Arial Narrow",sans-serif; --body:"Space Grotesk",system-ui,sans-serif;
  --caps:uppercase; --trk:.4; --r-lg:6px; --r:5px; --r-sm:4px; --shadow:none;
  color-scheme:dark;
}
[data-theme="giay"]{
  --ground:#f1ebdf; --surface:#faf6ee; --raised:#e9e1d1; --line:#d9cfbc;
  --chalk:#1c2620; --muted:#4f5a52; --dim:#6a7269;
  --brass:#1f5e45; --brass-ink:#faf6ee; --jade:#2f7d4f; --rust:#a3401f;
  --good-bg:#dcebdc; --good-line:#b4d1b8; --good-ink:#faf6ee; --bad-bg:#f3dccf; --bad-line:#dcb3a0;
  --press:#174a36; --press-2:#e2d8c4; --viz:#1f5e45; --viz-on:#2b7a5b;
  --display:"Playfair Display",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  --caps:none; --trk:0; --r-lg:4px; --r:3px; --r-sm:3px; --shadow:none;
  color-scheme:light;
}
[data-theme="dem"]{
  --ground:#0c1322; --surface:#141f36; --raised:#1c2a47; --line:#26365a;
  --chalk:#e9eef8; --muted:#9fb0cc; --dim:#7385a4;
  --brass:#5aa9ff; --brass-ink:#06101f; --jade:#4fd1a5; --rust:#f07b62;
  --good-bg:#12302e; --good-line:#1f5049; --good-ink:#06101f; --bad-bg:#3a1f22; --bad-line:#5a2f33;
  --press:#3f8ee6; --press-2:#26365a; --viz:#4a93e6; --viz-on:#6fb3ff;
  --display:"Lexend",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  --caps:none; --trk:0; --r-lg:18px; --r:14px; --r-sm:11px; --shadow:none;
  color-scheme:dark;
}
/* Anton chỉ có một độ đậm: đừng để trình duyệt tự tô đậm thêm */
[data-theme="neon"] body{font-synthesis:none}
[data-theme="giay"] .session em{font-style:italic}
/* Playfair mặc định dùng số kiểu cổ (cao thấp lệch nhau) — ép số thẳng hàng cho dễ đọc tạ/rep */
[data-theme="giay"] body,[data-theme="giay"] input,[data-theme="giay"] svg text{font-variant-numeric:lining-nums tabular-nums}
[data-theme="giay"] .num{font-variant-numeric:lining-nums tabular-nums}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--chalk);
  font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;
  padding:0 max(16px, env(safe-area-inset-left)) calc(90px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.small{font-size:14px} .tiny{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:10px}
h2{font-family:var(--display);text-transform:var(--caps);letter-spacing:calc(.06em * var(--trk));
  font-size:21px;font-weight:600;margin:28px 0 8px}
h2:first-child{margin-top:8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ground);
  padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.session{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:calc(.02em * var(--trk));text-transform:var(--caps)}
.session em{font-style:normal;color:var(--brass)}
.bar{height:5px;background:var(--raised);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .25s}
.dots{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.dot{flex:none;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);color:var(--dim);font-family:var(--display);font-size:17px;font-weight:600}
.dot.done{background:var(--good-bg);border-color:var(--good-line);color:var(--jade)}
.dot[aria-current=true]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.dot.opt{border-style:dashed}
.dotsep{flex:none;width:1px;background:var(--line);margin:5px 2px}
.opttag{display:inline-block;font-size:13px;line-height:1.35;padding:0 7px;margin-right:8px;
  border:1px dashed currentColor;border-radius:6px;color:var(--muted);vertical-align:2px}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:16px;cursor:pointer;color:inherit}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:var(--r);
  padding:17px 20px;font-weight:600;font-size:17px;min-height:60px;width:100%;
  font-family:var(--display);font-size:22px;letter-spacing:calc(.04em * var(--trk));text-transform:var(--caps)}
.btn:active{background:var(--press)}
.btn.jade{background:var(--jade);color:var(--good-ink)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;min-height:52px;font-weight:500}
.ghost:active{background:var(--raised)}
.ghost.sm{min-height:42px;padding:8px 14px;font-size:14px;border-radius:var(--r-sm)}
.ghost.danger{color:var(--rust);border-color:var(--bad-line)}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--muted);
  width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;font-size:20px;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- hình minh hoạ ---------- */
.figpair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 4px}
.figf{margin:0}
.figf img{width:100%;height:auto;display:block;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface)}
.figf figcaption{font-family:var(--display);font-size:13px;letter-spacing:calc(.07em * var(--trk));
  text-transform:var(--caps);color:var(--dim);text-align:center;margin-top:5px}
.exhead{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}

/* ---------- exercise ---------- */
.exname{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.08;
  letter-spacing:.01em;margin:2px 0 4px;text-wrap:balance}
.exrx{font-family:var(--display);font-size:18px;letter-spacing:calc(.07em * var(--trk));text-transform:var(--caps);color:var(--brass)}
.exrx .of{color:var(--dim)}
.alts{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}
.alts .lab{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-right:2px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:7px 13px;min-height:38px;font-size:14px;color:var(--muted)}
.chip:active{background:var(--raised)}
.chip[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
.prev{font-size:14px;color:var(--muted);background:var(--surface);border-left:3px solid var(--brass);
  border-radius:var(--r-sm);padding:10px 13px;margin:14px 0}
.prev b{color:var(--chalk);font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.prev .rule{display:block;margin-top:5px;font-size:13px;color:var(--dim)}
.prev .up{display:block;margin-top:6px;color:var(--jade);font-weight:500}
.warm{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:4px}
.warm .lab{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.warm .ws{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.breath{margin-top:12px;padding:9px 12px;border-left:2px solid var(--brass);background:var(--surface);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.breath b{color:var(--brass);font-weight:600;margin-right:4px}
.effort{text-align:center;color:var(--dim);font-size:13px;margin-top:10px}
details.note ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted);line-height:1.65}
details.note{margin-top:14px}
details.note ul.cool{list-style:none;padding:0;display:grid;gap:10px}
.cool li{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}
.cool img,.cool .noimg{width:112px;height:75px;object-fit:cover;border-radius:var(--r-sm);display:block}
.cool .noimg{height:0}
details.note .cool+p{margin-top:14px}
details.note summary{color:var(--muted);font-size:14px;cursor:pointer;list-style:none;padding:6px 0}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"▸ ";color:var(--dim)}
details.note[open] summary::before{content:"▾ "}
details.note p{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.5}

/* ---------- done sets ---------- */
.doneset{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.doneset.editing{border-color:var(--brass)}
.ds-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:transparent;
  border:0;padding:13px 6px 13px 15px;text-align:left;min-height:54px}
.ds-main .tick{color:var(--jade);font-size:18px;flex:none}
.ds-main .val{font-family:var(--display);font-size:21px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.ds-del{flex:none;width:52px;background:transparent;border:0;border-left:1px solid var(--line);
  color:var(--dim);font-size:23px;line-height:1}
.ds-del:active{background:var(--raised);color:var(--rust)}

/* ---------- stepper ---------- */
.setlabel{font-family:var(--display);font-size:17px;letter-spacing:calc(.08em * var(--trk));text-transform:var(--caps);
  color:var(--dim);text-align:center;margin:18px 0 10px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.stepper .cap{text-align:center;color:var(--dim);font-size:12.5px;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:8px}
.stepper .ctrl{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:4px}
.stepper button{background:var(--raised);border:0;border-radius:var(--r);height:54px;
  font-size:26px;font-family:var(--display);font-weight:600;color:var(--chalk)}
.stepper button:active{background:var(--press-2)}
.stepper input{width:100%;min-width:0;background:transparent;border:0;color:var(--chalk);text-align:center;
  font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:0 2px;min-height:54px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- rest timer ---------- */
.rest{background:var(--surface);border:1px solid var(--brass);border-radius:var(--r-lg);padding:18px;text-align:center}
.rest .lab{font-family:var(--display);font-size:17px;letter-spacing:calc(.1em * var(--trk));text-transform:var(--caps);color:var(--brass)}
.rest .clock{font-family:var(--display);font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}

/* ---------- generic form ---------- */
input,select,textarea{font-family:var(--body);font-size:16px;background:var(--ground);color:var(--chalk);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 13px;width:100%;min-height:52px}
input[type=number]{font-family:var(--display);font-size:21px;font-weight:600;text-align:center;
  font-variant-numeric:tabular-nums;padding:10px 6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
label.f{display:block}
label.f>span{display:block;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.badge{font-family:var(--display);font-size:13px;letter-spacing:calc(.06em * var(--trk));padding:3px 9px;
  border-radius:6px;background:var(--raised);color:var(--muted)}
.badge.up{background:var(--good-bg);color:var(--jade)} .badge.down{background:var(--bad-bg);color:var(--rust)}
details.sec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
details.sec>summary{padding:17px 16px;font-family:var(--display);font-size:20px;font-weight:600;
  text-transform:var(--caps);letter-spacing:calc(.05em * var(--trk));cursor:pointer;list-style:none;display:flex;
  justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--brass);font-size:26px;line-height:1}
details.sec[open]>summary::after{content:"–"}
details.sec>.body{padding:0 16px 16px;border-top:1px solid var(--line)}
details.sess{padding:0}
details.sess>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:12px}
details.sess>summary::-webkit-details-marker{display:none}
details.sess>summary::after{content:"▸";color:var(--dim);transition:transform .15s}
details.sess[open]>summary::after{transform:rotate(90deg)}
details.sess>.body{padding:2px 16px 10px;border-top:1px solid var(--line)}
.wkhead{margin:10px 2px -2px;color:var(--dim)}

/* ---------- ăn ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* nhóm món: một hàng cuộn ngang để kết quả tìm nằm ngay dưới ô tìm */
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;white-space:nowrap}
.favs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fav{position:relative;display:flex}
.favbtn{width:100%;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  color:var(--chalk);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;font:inherit;font-size:14px;line-height:1.3}
.favbtn:active{background:var(--raised)}
.favdel{position:absolute;top:-8px;right:-8px;width:32px;height:32px;background:var(--ground);color:var(--rust);border-color:var(--bad-line)}
.foodrow{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;
  cursor:pointer;padding:12px 2px;text-align:left}
.foodrow[aria-expanded=true]{color:var(--brass)}
.foodsel{margin:10px 0 12px;background:var(--ground)}
/* ---------- tiến bộ ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:4px;margin:4px 0 16px}
.seg button{background:transparent;border:0;color:var(--muted);border-radius:var(--r-sm);min-height:40px;font:inherit;font-size:15px}
.seg button[aria-selected=true]{background:var(--raised);color:var(--chalk)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.stat{min-width:0}
.chart{position:relative;margin-top:8px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.cg{stroke:var(--line);stroke-width:1}
.ct{fill:var(--dim);font-size:11px;font-family:var(--body, inherit)}
.cval{fill:var(--chalk);font-size:12px;font-weight:600}
.cline{fill:none;stroke:var(--viz);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cdot{fill:var(--viz);stroke:var(--surface);stroke-width:2}
.cdot.on{r:6}
.cbar{fill:var(--viz)}
.cbar.on{fill:var(--viz-on)}
.cref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.cx{stroke:var(--muted);stroke-width:1}
.chit{fill:transparent;outline:none}
.chart:focus-within svg{outline:2px solid var(--line);outline-offset:4px;border-radius:6px}
.ctip{position:absolute;top:-6px;transform:translateY(-100%);background:var(--raised);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:7px 10px;font-size:14px;pointer-events:none;white-space:nowrap;z-index:5}
.ctip b{font-family:var(--display);font-size:17px}
.dtab{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.dtab th{text-align:left;color:var(--dim);font-weight:500;padding:4px 0}
.dtab td{padding:5px 0;border-top:1px solid var(--line);color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.themebtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--ground);color:var(--muted);font:inherit;font-size:14px;cursor:pointer;min-height:76px}
.themebtn[aria-checked=true]{border-color:var(--brass);color:var(--chalk);box-shadow:0 0 0 1px var(--brass)}
.sw{display:flex;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.sw i{width:16px;height:22px;display:block}
.sw[data-sw=hientai] i:nth-child(1){background:#0d1014} .sw[data-sw=hientai] i:nth-child(2){background:#171d22} .sw[data-sw=hientai] i:nth-child(3){background:#e0a233}
.sw[data-sw=sang] i:nth-child(1){background:#f5f4f0} .sw[data-sw=sang] i:nth-child(2){background:#ffffff} .sw[data-sw=sang] i:nth-child(3){background:#d9531c}
.sw[data-sw=neon] i:nth-child(1){background:#0a0a0b} .sw[data-sw=neon] i:nth-child(2){background:#1f1f23} .sw[data-sw=neon] i:nth-child(3){background:#c8ff2e}
.sw[data-sw=giay] i:nth-child(1){background:#f1ebdf} .sw[data-sw=giay] i:nth-child(2){background:#faf6ee} .sw[data-sw=giay] i:nth-child(3){background:#1f5e45}
.sw[data-sw=dem] i:nth-child(1){background:#0c1322} .sw[data-sw=dem] i:nth-child(2){background:#1c2a47} .sw[data-sw=dem] i:nth-child(3){background:#5aa9ff}
.sw[data-sw=auto] i:nth-child(1){background:#f5f4f0} .sw[data-sw=auto] i:nth-child(2){background:#0c1322} .sw[data-sw=auto] i:nth-child(3){background:linear-gradient(90deg,#d9531c 50%,#5aa9ff 50%)}
.restmini{text-align:center;color:var(--brass);font-size:15px;margin:4px 0 12px}
.restmini b{font-size:20px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.trio button{padding-left:6px;padding-right:6px;font-size:14px}
#tray{border-color:var(--brass)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--ground) 96%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{background:transparent;border:0;color:var(--dim);padding:8px 2px 6px;border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
.tab .ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab .lb{font-family:var(--display);font-size:14px;letter-spacing:calc(.08em * var(--trk));text-transform:var(--caps);font-weight:600}
.tab[aria-current=page]{color:var(--brass);background:var(--surface)}
.empty{text-align:center;color:var(--dim);padding:44px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
  background:var(--jade);color:var(--good-ink);padding:13px 22px;border-radius:99px;font-weight:600;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap}
.toast.show{opacity:1}
body.onb nav,body.typing nav{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const today = () => { const x = new Date();
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>

const addDays = (s, n) => { const x = new Date(s + "T00:00:00"); x.setDate(x.getDate() + n);
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
/** Thứ Hai cùng tuần hoặc ngay trước ngày s — tuần giáo án khớp tuần lịch. */

/* Set mỗi tuần cho từng nhóm cơ, cách đếm "phân số" của Pelland 2025: nhóm chính 1 set,

  "Xà đeo tạ": PULL, "Lat Pulldown": PULL, "Barbell Row": ROW, "Kéo cáp ngồi": ROW, "Row tạ tay một tay": ROW,
  "Face Pull": { vaisau: 1 }, "Dumbbell Curl": { tt: 1 }, "Hammer Curl": { tt: 1 }, "Incline Dumbbell Curl": { tt: 1 },
  "Triceps Pushdown": { ts: 1 }, "Duỗi tay sau qua đầu": { ts: 1 },
  "Back Squat": { dt: 1 }, "Leg Press": { dt: 1 }, "Hack Squat máy": { dt: 1 }, "Bulgarian Split Squat": { dt: 1 },
  "Leg Extension": { dt: 1 }, "Romanian Deadlift": { ds: 1 }, "Leg Curl": { ds: 1 }, "Leg Curl ngồi máy": { ds: 1 },

function weeklySets(t) {

function seed(programId) {

    profile: { name: "", sex: "m", age: "", height: "", weight: "",

      goalWeight: "", startDate: mondayOf(today()), weeks: 8 },

/* ---------------- lưu trữ ---------------- */
function load() {

    const old = JSON.parse(localStorage.getItem("soSat.v1") || "null");

  } catch (e) { /* dữ liệu hỏng hoặc trình duyệt chặn — dùng bản mặc định */ }

}
/** Dữ liệu từ trước khi có màn hình chào: đã ghi gì (set, cân, hồ sơ) thì coi như thiết lập xong. */

/** v1 chưa có start/step/rest — lấy từ bản mặc định theo tên bài. */
function migrate(old) {
  const base = seed(), byName = {};
  base.days.forEach(d => d.exercises.forEach(e => { byName[e.name] = e; }));
  old.days.forEach(d => d.exercises.forEach(e => {
    const b = byName[e.name] || {};
    if (e.start == null) e.start = b.start != null ? b.start : 0;
    if (e.step == null) e.step = b.step || 2.5;
    if (e.rest == null) e.rest = b.rest || 120;
    if (e.fig == null) e.fig = FIGKEY[e.name] || "";
    if (e.alts == null) e.alts = altsFor(e.name);
    if (e.warm == null) e.warm = WARM.includes(e.name);
    if (e.opt == null) e.opt = OPTIONAL.includes(e.name);

  if (!old.swap) old.swap = {};
  if (!old.skip) old.skip = {};
  old.days.concat(old.oldDays || []).forEach(d => d.exercises.forEach(e => {
    const fix = e.note && NOTE_FIX[strHash(e.note)]; if (fix) e.note = fix;
  }));

/** Ghi chú cũ của bản đầu (viết riêng cho một người) → bản chung. So bằng mã băm để code

  "1uaf6f3": "Vai sau, giúp chống gù vai. Kéo dây về phía trán, siết bả vai, đừng nặng quá.",
  "53xulu": "Đùi trước, bài chính của buổi. Xuống tới khi đùi song song sàn hoặc sâu hơn, gối đi theo hướng mũi chân.",
  "1wd7vj": "Tập từng chân nên cân lại chân yếu hơn. Chân sau gác ghế, dồn lực vào gót chân trước.",

  d.days.forEach(x => x.exercises.forEach(e => {
    const m = SWAP_V7[e.name]; if (!m) return;
    const [name, oldAlt, conv] = m, b = base.get(name);
    let lastKg = null, lastDate = "";

      const sw = (d.swap || {})[k] || "", a = (e.alts || []).find(y => y.id === sw);

/** Bài thay thế nằm trong dữ liệu đã lưu: bản cũ (chưa có ảnh, tên cũ) phải thay bằng bản hiện tại, bài tự thêm thì giữ. */

    if (!b) { e.fig = e.fig || FIGKEY[e.name] || ""; return; }
    e.fig = e.fig || b.fig;

/** v4 giữ bài trùng tên lại làm bài phụ để khỏi mất nhật ký — nay gộp về một bài. */

  d.days.forEach(x => x.exercises.forEach(e => { home[e.id] = x.id; }));

    const out = {};
    for (const k in d[f] || {}) {

    const out = {};
    for (const k in d[f] || {}) {
      const [date, dayId, exId] = k.split("|");

/** Đổi giáo án: bài đã có nhật ký của giáo án cũ cất vào oldDays để tab Nhật ký vẫn gọi

let saveTimer = null;
function save(now) {

let S = load();
let tab = "train";
let curDate = today();
let curDay = null;
let exIdx = 0;
let editIdx = null;
let restEnd = 0, restTimer = null;
let showPicker = false;

  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);

/* ---------------- tính toán ---------------- */
function targets() {
  const p = S.profile, w = +p.weight, h = +p.height, a = +p.age;
  if (!(w > 0 && h > 0 && a > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "m" ? 5 : -161);
  const tdee = bmr * (+p.activity || 1.5);
  const kcal = tdee + (+p.surplus || 0);
  const protein = w * (+p.proteinPerKg || 2);
  const fat = w * (+p.fatPerKg || 1);
  return { bmr, tdee, kcal, protein, fat, carb: Math.max(0, (kcal - protein * 4 - fat * 9) / 4) };
}
function weekNo(d) {
  const s = new Date(S.profile.startDate + "T00:00:00"), x = new Date(d + "T00:00:00");
  if (isNaN(s) || isNaN(x)) return 1;
  return Math.max(1, Math.floor((x - s) / 604800000) + 1);
}
const lkey = (date, dayId, exId) => date + "|" + dayId + "|" + exId;
const sets = (date, dayId, exId) => S.log[lkey(date, dayId, exId)] || [];
const skipped = (date, dayId, exId) => +(S.skip || {})[lkey(date, dayId, exId)] || 0;

function sessionDates() {
  const s = new Set();
  for (const k in S.log) if ((S.log[k] || []).length) s.add(k.split("|")[0]);
  return [...s].sort().reverse();
}
function dayOfDate(date) {
  for (const d of S.days) for (const e of d.exercises)
    if (sets(date, d.id, e.id).length) return d.id;
  return null;
}
/** Buổi hôm nay nếu đã ghi; nếu chưa thì buổi kế tiếp sau buổi gần nhất. */
function autoDay() {
  const t = dayOfDate(curDate); if (t) return t;
  for (const dt of sessionDates()) {
    const d = dayOfDate(dt);
    if (d) { const i = S.days.findIndex(x => x.id === d); return S.days[(i + 1) % S.days.length].id; }
  }
  return S.days[0].id;
}
/** Bài thay thế giữ id của ô bài chính (tiến độ, nhật ký tính như cũ) nhưng có tên, tạ, lịch sử riêng. */
function eff(ex, date, dayId) {
  const altId = S.swap[lkey(date, dayId, ex.id)] || "";
  if (!altId) return { ...ex, altId: "", altOf: "" };
  const a = (ex.alts || []).find(x => x.id === altId);
  if (!a) return { ...ex, name: ex.name + " (bài thay đã xoá)", note: "", fig: "", altId, altOf: ex.name };
  return { ...ex, name: a.name, reps: a.reps || ex.reps, unit: a.unit || ex.unit,
    start: +a.start || 0, step: +a.step || ex.step, note: a.note || "", fig: a.fig || "",
    altId, altOf: ex.name };
}
function lastPerf(exId, altId) {
  let best = null;
  for (const k in S.log) {
    const [d, , e] = k.split("|");
    if (e !== exId || d >= curDate || !(S.log[k] || []).length) continue;
    if ((S.swap[k] || "") !== (altId || "")) continue;
    if (!best || d > best.date) best = { date: d, sets: S.log[k] };

}

    const [d, dayId, exId] = k.split("|");
    if (d >= curDate || exId === ex.id || !(S.log[k] || []).length || (best && d <= best.date)) continue;
    const dd = allDays().find(x => x.id === dayId), e = dd && dd.exercises.find(x => x.id === exId);

  return n1(Math.max(...p.sets.map(s => +s.kg || 0)) + +ex.step);

function suggest(ex, i) {

  const p = perf(ex), up = levelUp(ex, p);

    const n = {};
    p.sets.forEach(s => { const k = +s.kg || 0; n[k] = (n[k] || 0) + 1; });
    const top = Object.keys(n).map(Number).sort((a, b) => n[b] - n[a] || b - a)[0];

  d.exercises.forEach(e => {
    const n = Math.min(rested(curDate, d.id, e), e.sets), t = +e.sets || 0;
    if (e.opt) { r.optDone += n; r.optTotal += t; } else { r.mainDone += n; r.mainTotal += t; }
  });
  r.done = r.mainDone + (S.hideOpt ? 0 : r.optDone);
  r.total = r.mainTotal + (S.hideOpt ? 0 : r.optTotal);
  r.pct = r.total ? Math.round(r.done / r.total * 100) : 0;

function volume(date) {
  let v = 0;
  for (const k in S.log) if (k.startsWith(date + "|"))
    (S.log[k] || []).forEach(s => { v += (+s.kg || 0) * (+s.reps || 0); });
  return v;
}

/* ---------------- thanh trên cùng ---------------- */
/** "Buổi A" -> Buổi <em>A</em>; escape từng phần rồi mới ghép thẻ. */
function hiName(name) {
  const w = String(name).trim().split(/\s+/);
  return w.length > 1
    ? esc(w.slice(0, -1).join(" ")) + " <em>" + esc(w[w.length - 1]) + "</em>"
    : "<em>" + esc(name) + "</em>";

function renderTop() {
  const el = $("#topbar");
  if (tab !== "train") {
    el.innerHTML = `<div class="topline"><div class="session">${tab === "setup" ? "Gym <em>Book</em>"
      : tab === "an" ? "Ăn <em>uống</em>" : tab === "history" ? "Nhật <em>ký</em>" : "Hồ <em>sơ</em>"}</div></div>`;
    return;
  }
  const d = day(), pr = progress(), hasOpt = pr.optTotal > 0;
  const vis = visible(d), firstOpt = vis.find(i => d.exercises[i].opt);
  const dots = vis.map((i, k) => {
    const e = d.exercises[i], n = rested(curDate, d.id, e);
    return (i === firstOpt && k ? `<span class="dotsep" aria-hidden="true"></span>` : "") +
      `<button class="dot ${e.opt ? "opt" : ""} ${n >= e.sets ? "done" : ""}" data-jump="${i}"
      aria-current="${i === exIdx}" aria-label="${esc(eff(e, curDate, d.id).name)}${e.opt ? " (phụ)" : ""}">${n >= e.sets ? "✓" : k + 1}</button>`;
  }).join("");
  const count = hasOpt
    ? `<span style="white-space:nowrap">${pr.mainDone}/${pr.mainTotal} chính</span>${S.hideOpt ? ""
      : ` · <span style="white-space:nowrap">${pr.optDone}/${pr.optTotal} phụ</span>`}`
    : `${pr.done}/${pr.total} set`;
  el.innerHTML = `
    <div class="topline">
      <div>
        <div class="session">${hiName(d.name)}</div>
        <div class="small muted" style="margin-top:-2px">Tuần ${weekNo(curDate)} · ${fmtDate(curDate)} · ${count}</div>
      </div>
      <div class="row" style="gap:8px">
        ${hasOpt ? `<button class="ghost sm" id="optToggle" style="white-space:nowrap;padding:8px 11px" aria-pressed="${!!S.hideOpt}"
          aria-label="${S.hideOpt ? "Hiện bài phụ" : "Ẩn bài phụ"}">${S.hideOpt ? "Hiện phụ" : "Ẩn phụ"}</button>` : ""}
        <button class="iconbtn" id="pickerBtn" aria-label="Đổi ngày hoặc buổi tập">${showPicker ? "×" : "⋯"}</button>
      </div>
    </div>
    <div class="bar"><i style="width:${pr.pct}%"></i></div>
    <div class="dots">${dots}</div>`;
}

/* ---------------- cách thở ----------------
   Bài nặng nhiều khớp: hít căng bụng rồi nín (gồng bụng giữ lưng) trong một rep.
   Còn lại: thở ra lúc gắng sức, hít vào khi hạ. Theo khoá ảnh nên bài thay thế cũng có. */
const BRACE_NOTE = " Huyết áp cao thì đừng nín — thở ra từ từ khi lên.";
const BREATH = {
  squat: "Hít căng bụng, nín và siết bụng rồi mới xuống · đứng lên qua đoạn khó mới thở ra." + BRACE_NOTE,
  hinge: "Hít căng bụng, nín và siết bụng rồi mới kéo · đứng thẳng mới thở ra, lấy hơi lại mỗi rep." + BRACE_NOTE,
  press: "Hít sâu, nín và siết bụng khi hạ tạ · thở ra khi đẩy qua đoạn khó." + BRACE_NOTE,
  row: "Hít vào, siết bụng giữ lưng thẳng · thở ra khi kéo tạ lên, hít vào khi hạ.",
  other: "Thở ra khi gắng sức (đẩy, kéo, đứng lên) · hít vào khi hạ về · đừng nín thở.",
};
const BREATH_KIND = { squat: "squat", smithsquat: "squat", hack: "squat", goblet: "squat",
  deadlift: "hinge", trapbar: "hinge", rackpull: "hinge", rdl: "hinge", dbrdl: "hinge",
  bench: "press", ohp: "press", row: "row" };
const breathFor = ex => BREATH[BREATH_KIND[ex.fig] || "other"];

  tren: [["Ngực, vai trước: đan tay sau lưng, duỗi thẳng rồi nâng lên, ưỡn ngực · 30–45 giây", "chest"],

function cooldown(d) {
  const n = d.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").toLowerCase();
  const list = COOLDOWN[/day/.test(n) ? "day" : /keo/.test(n) ? "keo" : /chan|duoi/.test(n) ? "chan"

/* ---------------- TẬP ---------------- */
function viewTrain() {
  const d = day();
  if (!d.exercises.length) return `<div class="empty">Buổi này chưa có bài nào.<br><br>
    <button class="ghost" data-goto="me">Mở Hồ sơ → Chương trình</button></div>`;
  if (exIdx >= d.exercises.length) exIdx = 0;
  const slot = d.exercises[exIdx], ex = eff(slot, curDate, d.id);
  const vis = visible(d), pos = vis.indexOf(exIdx), prevI = vis[pos - 1], nextI = vis[pos + 1];
  const done = sets(curDate, d.id, ex.id);
  const skip = skipped(curDate, d.id, ex.id);
  const total = +ex.sets || 1;
  const idx = editIdx != null ? editIdx : done.length;
  const finished = done.length + skip >= total && editIdx == null;

  let picker = "";
  if (showPicker) {
    picker = `<div class="card stack" style="margin-bottom:16px">
      <label class="f"><span>Ngày tập</span><input type="date" id="dateInput" value="${curDate}"></label>
      <div><span class="tiny muted" style="display:block;margin-bottom:8px">Buổi tập</span>
        <div class="pair">${S.days.map(x =>
          `<button class="ghost" data-day="${x.id}"
            style="${x.id === curDay ? "border-color:var(--brass);color:var(--brass)" : ""}">${esc(x.name)}</button>`).join("")}</div></div>
    </div>`;
  }

  const p = perf(ex), up = levelUp(ex, p), unit = String(ex.unit).replace(/^\+/, "");
  const prev = p
    ? `<div class="prev">Lần trước · ${fmtDate(p.date)} — ` +
      p.sets.map(s => `<b>${esc(s.kg)}</b>×<b>${esc(s.reps)}</b>`).join(" &nbsp; ") +
      (up != null
        ? `<span class="up">↑ Đủ rep ở mọi set — hôm nay lên ${esc(up)} ${esc(unit)}</span>`
        : `<span class="rule">Đủ ${repHigh(ex.reps)} rep ở cả ${total} set thì buổi sau app tự tăng ${esc(ex.step)} ${esc(unit)}.</span>`) +
      `</div>`
    : ex.altId
      ? `<div class="prev dim">Chưa tập bài này — mức gợi ý chỉ là ước lượng, set đầu làm nhẹ để dò.</div>`
      : `<div class="prev dim">Chưa có buổi trước — số bạn ghi hôm nay là mốc gốc.</div>`;

  const alts = (slot.alts || []).length
    ? `<div class="alts" role="group" aria-label="Máy bận thì đổi bài"><span class="lab">Máy bận?</span>` +
      [{ id: "", name: slot.name }].concat(slot.alts).map(a =>
        `<button class="chip" data-alt="${esc(a.id)}" aria-pressed="${a.id === ex.altId}">${esc(a.name)}</button>`).join("") +
      `</div>`
    : "";

  const doneList = done.map((s, i) => `
    <div class="doneset ${editIdx === i ? "editing" : ""}">
      <button class="ds-main" data-edit="${i}">
        <span class="tick">✓</span><span class="muted">Set ${i + 1}</span>
        <span class="val">${esc(s.kg)} <span style="color:var(--dim)">×</span> ${esc(s.reps)}</span>
      </button>
      <button class="ds-del" data-delset="${i}" aria-label="Xoá set ${i + 1}">×</button>
    </div>`).join("") + (skip ? `
    <div class="doneset">
      <div class="ds-main"><span class="tick" style="color:var(--dim)">–</span>
        <span class="muted">Đã bỏ qua ${skip} set</span></div>
      <button class="ds-del" data-unskip="1" aria-label="Hoàn lại set đã bỏ qua">×</button>
    </div>` : "");

  /* --- khu vực hành động --- */
  let action = "";
  const resting = restEnd > Date.now();

  if (resting && editIdx == null) {
    action = `<div class="rest">
      <div class="lab">Nghỉ</div>
      <div class="clock" id="restNum">${mmss(Math.ceil((restEnd - Date.now()) / 1000))}</div>
      <div class="pair" style="margin-top:14px">
        <button class="ghost" id="restAdd">+30 giây</button>
        <button class="ghost" id="restSkip">Bỏ qua</button>
      </div></div>`;
  } else if (finished) {
    const pr = progress(), nextU = nextUnfinished(exIdx), next = nextU != null ? eff(d.exercises[nextU], curDate, d.id) : null;
    const optLeft = d.exercises.findIndex(e => e.opt && rested(curDate, d.id, e) < e.sets);
    action = !ex.opt && !S.hideOpt && optLeft >= 0 && pr.mainDone >= pr.mainTotal
      ? `<div class="card" style="text-align:center;border-color:var(--jade)">
          <div class="num" style="font-size:34px;color:var(--jade)">Xong bài chính</div>
          <div class="muted small" style="margin-bottom:12px">Còn sức và thời gian thì làm bài phụ, mệt thì về — không sao.</div>
          <div class="pair"><button class="ghost" data-jump="${optLeft}">Làm bài phụ</button>
            <button class="ghost" data-goto="history">Kết thúc buổi</button></div>${cooldown(d)}</div>`
      : next
      ? `<button class="btn jade" data-jump="${nextU}">Bài tiếp · ${esc(next.name)}${next.opt ? " (phụ)" : ""}</button>`
      : pr.done >= pr.total
        ? `<div class="card" style="text-align:center;border-color:var(--jade)">
            <div class="num" style="font-size:38px;color:var(--jade)">Xong buổi</div>
            <div class="muted small" style="margin-bottom:12px">Tổng khối lượng
              <b class="num" style="color:var(--chalk);font-size:19px">${Math.round(volume(curDate)).toLocaleString("vi-VN")}</b> kg</div>
            <button class="ghost" data-goto="history">Xem nhật ký</button>${cooldown(d)}</div>`
        : `<button class="btn" data-jump="${firstUnfinished()}">Quay lại bài chưa xong</button>`;
  } else {
    const sg = editIdx != null ? done[editIdx] : suggest(ex, idx);
    const wu = ex.warm && !ex.altId && !done.length && editIdx == null ? warmups(+sg.kg, ex.name) : [];
    action = (resting ? `<div class="restmini">Đang nghỉ · <b class="num" id="restNum">${mmss(Math.ceil((restEnd - Date.now()) / 1000))}</b></div>` : "")
      + (wu.length ? `
      <div class="warm"><div class="lab">Khởi động · nghỉ ~1 phút · không ghi</div>
        <div class="ws">${wu.map(w => `${w.kg}×${w.reps}`).join(" &nbsp;·&nbsp; ")}</div></div>` : "") + `
      <div class="setlabel">${editIdx != null ? "Sửa set " + (editIdx + 1) : "Set " + (idx + 1) + " / " + total}</div>
      <div class="steppers">
        <div class="stepper"><div class="cap">${esc(ex.unit)}</div>
          <div class="ctrl">
            <button data-step="kg:-1" aria-label="Giảm tạ">−</button>
            <input id="kgVal" type="number" inputmode="decimal" step="${ex.step || 2.5}" value="${esc(sg.kg)}" aria-label="Mức tạ">
            <button data-step="kg:1" aria-label="Tăng tạ">+</button>
          </div></div>
        <div class="stepper"><div class="cap">rep · mục tiêu ${esc(ex.reps)}</div>
          <div class="ctrl">
            <button data-step="reps:-1" aria-label="Giảm rep">−</button>
            <input id="repVal" type="number" inputmode="numeric" step="1" value="${esc(sg.reps)}" aria-label="Số rep">
            <button data-step="reps:1" aria-label="Tăng rep">+</button>
          </div></div>
      </div>
      <button class="btn" id="logSet" style="margin-top:14px">
        ${editIdx != null ? "Cập nhật set " + (editIdx + 1) : "✓ Xong set " + (idx + 1)}</button>
      ${editIdx == null ? `<div class="pair" style="margin-top:10px">
        <button class="ghost sm" data-skip="one">Bỏ qua set</button>
        ${total - done.length - skip > 1 ? `<button class="ghost sm" data-skip="rest">Bỏ qua bài</button>` : ""}
      </div>` : ""}
      ${editIdx == null ? `<div class="breath"><b>Thở</b> ${esc(breathFor(ex))}</div>` : ""}
      ${editIdx == null && idx === 0 ? `<div class="effort">Mỗi set dừng khi còn 1–3 rep nữa là hết sức, không để gãy form</div>` : ""}
      ${editIdx != null ? `<button class="ghost" id="cancelEdit" style="margin-top:10px;width:100%">Huỷ</button>` : ""}`;
  }

  const general = exIdx === 0 && !progress().done ? `<details class="note" style="margin:0 0 12px">
      <summary>Khởi động chung · 8–10 phút trước bài đầu</summary>
      <ul><li>Đạp xe hoặc đi bộ dốc 4–5 phút, tới khi hơi ra mồ hôi</li>
        <li>Vung chân trước–sau rồi sang ngang · 10 mỗi chân</li>
        <li>World's greatest stretch · 5 mỗi bên</li>
        <li>Cat–camel · 8 lần</li>
        <li>Glute bridge · 12 lần</li>
        <li>Squat không tạ, giữ dưới 2 giây · 10 lần</li>
        <li>Xoay tay vòng lớn, dang tay siết bả vai · 15 lần</li></ul>
      <p>Không kéo giãn giữ lâu trước khi tập nặng — để dành cho sau buổi.</p></details>` : "";

  return `${picker}${general}
    <div class="exname">${esc(ex.name)}</div>
    <div class="exrx">${ex.opt ? `<span class="opttag">Phụ</span>` : ""}${total} set × ${esc(ex.reps)} rep${ex.altOf ? ` <span class="of">· thay ${esc(ex.altOf)}</span>` : ""}</div>
    ${alts}
    ${prev}
    ${doneList}
    ${action}
    ${(ex.fig || ex.note) ? `<details class="note"${p ? "" : " open"}>
      <summary>Cách tập${p ? "" : " · mở sẵn vì bạn chưa tập bài này"}</summary>
      ${figureHTML(ex.fig)}${ex.note ? `<p>${esc(ex.note)}</p>` : ""}</details>` : ""}
    <div class="pair" style="margin-top:22px">
      <button class="ghost" data-jump="${prevI ?? -1}"${prevI == null ? ' disabled style="opacity:.35"' : ""}>‹ Bài trước</button>
      <button class="ghost" data-jump="${nextI ?? -1}"${nextI == null ? ' disabled style="opacity:.35"' : ""}>Bài sau ›</button>
    </div>`;
}

/* ---------------- NHẬT KÝ ---------------- */
/** Các bài đã ghi trong một ngày, kể cả bài nay đã chuyển sang buổi khác. */
function sessionRows(date) {
  const rows = [];
  for (const k in S.log) {
    if (!k.startsWith(date + "|") || !(S.log[k] || []).length) continue;
    const [, dayId, exId] = k.split("|");
    const all = allDays(), di = all.findIndex(x => x.exercises.some(e => e.id === exId));
    const d = di >= 0 ? all[di] : null, e = d && d.exercises.find(x => x.id === exId);
    rows.push({ dayId: d ? d.id : dayId, sets: S.log[k],
      order: e ? di * 100 + d.exercises.indexOf(e) : 9999,
      name: e ? eff(e, date, d.id).name : "Bài đã xoá" });
  }
  return rows.sort((a, b) => a.order - b.order);
}
function viewHistory() {
  const view = histView || S.histView || "prog";
  const seg = `<div class="seg" role="tablist">
    <button role="tab" data-hview="prog" aria-selected="${view === "prog"}">Tiến bộ</button>
    <button role="tab" data-hview="list" aria-selected="${view === "list"}">Các buổi</button></div>`;
  return seg + (view === "prog" ? viewProgress() : viewSessions());
}
function viewSessions() {
  const dates = sessionDates();
  if (!dates.length) return `<div class="empty">Chưa ghi buổi nào.<br>Sang tab Tập và bấm xong set đầu tiên.</div>`;
  let wk = null;
  return `<div class="sub">${dates.length} buổi. Khối lượng = tạ × rep cộng dồn — con số này tăng đều nghĩa là bạn đang tiến bộ. Bấm vào một buổi để xem chi tiết.</div>
  <div class="stack">` + dates.map(date => {
    const list = sessionRows(date), tally = {};
    list.forEach(r => { tally[r.dayId] = (tally[r.dayId] || 0) + r.sets.length; });
    const top = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
    const d = allDays().find(x => x.id === top);
    const nSets = list.reduce((a, r) => a + r.sets.length, 0);
    const rows = list.map(r => `<div class="lrow"><div>${esc(r.name)}</div>
        <div class="num muted">${r.sets.map(x => `${esc(x.kg)}×${esc(x.reps)}`).join("  ")}</div></div>`).join("");
    const w = weekNo(date), from = addDays(S.profile.startDate, (w - 1) * 7);
    const range = isNaN(new Date(from + "T00:00:00")) ? "" : ` · ${fmtDate(from)} – ${fmtDate(addDays(from, 6))}`;
    const head = w !== wk ? `<div class="tiny wkhead">Tuần ${w}${range} · ${dates.filter(x => weekNo(x) === w).length} buổi</div>` : "";
    wk = w;
    return `${head}<details class="card sess">
      <summary>
        <div style="flex:1;min-width:0"><div class="num" style="font-size:19px">${fmtDate(date)} · ${esc(d ? d.name : "?")}</div>
          <div class="small dim">${list.length} bài · ${nSets} set</div></div>
        <div style="text-align:right"><div class="num" style="font-size:19px;color:var(--brass)">${Math.round(volume(date)).toLocaleString("vi-VN")}</div>
          <div class="small dim">kg</div></div>
      </summary><div class="body">${rows}</div></details>`;
  }).join("") + `</div>`;
}

/* ---------------- TIẾN BỘ (biểu đồ) ----------------
   SVG tự vẽ, không thư viện (chạy offline). Mỗi biểu đồ một chuỗi số nên không cần chú giải —

let histView = null, progEx = null, progMetric = "e1rm";
const CHARTS = {};
/** 1RM ước tính theo Epley — chỉ tin với set ≤ 12 rep. */

/** Các bài đã tập (theo tên thật hôm đó, kể cả bài thay thế), nhiều buổi nhất trước. */
function trainedNames() {
  const n = {};
  for (const k in S.log) {
    if (!(S.log[k] || []).length) continue;
    const [date, dayId, exId] = k.split("|");
    const d = allDays().find(x => x.id === dayId) || allDays().find(x => x.exercises.some(e => e.id === exId));
    const e = d && d.exercises.find(x => x.id === exId);
    if (!e) continue;
    const name = eff(e, date, d.id).name;
    (n[name] = n[name] || { n: 0, unit: eff(e, date, d.id).unit, dates: new Set() }).dates.add(date);
  }
  return Object.entries(n).map(([name, v]) => ({ name, unit: v.unit, n: v.dates.size }))
    .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}
/** Mỗi ngày một điểm: tạ nặng nhất, 1RM ước tính tốt nhất, tổng tạ × rep, set nặng nhất. */
function exSeries(name) {
  const by = {};
  for (const k in S.log) {
    const sets = S.log[k] || []; if (!sets.length) continue;
    const [date, dayId, exId] = k.split("|");
    const d = allDays().find(x => x.id === dayId) || allDays().find(x => x.exercises.some(e => e.id === exId));
    const e = d && d.exercises.find(x => x.id === exId);
    if (!e || eff(e, date, d.id).name !== name) continue;
    const r = by[date] = by[date] || { date, top: 0, e1rm: 0, vol: 0, best: null };
    sets.forEach(s => {
      const kg = +s.kg || 0, reps = +s.reps || 0;
      if (kg > r.top || (kg === r.top && r.best && reps > +r.best.reps)) { r.top = kg; r.best = s; }

/** Bước chia trục tròn (1, 2, 5 × 10ⁿ) gần với span. */
const niceStep = span => { const p = Math.pow(10, Math.floor(Math.log10(span || 1))), f = span / p;
  return (f <= 1.5 ? 1 : f <= 3 ? 2 : f <= 7 ? 5 : 10) * p; };

function yScale(vals, fromZero) {
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (fromZero) lo = 0;
  if (hi === lo) { hi += 1; lo = fromZero ? 0 : lo - 1; }
  const step = niceStep((hi - lo) / 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(n1(v));

}
const W = 360, H = 190, PL = 44, PR = 12, PT = 14, PB = 26;
/** pts: [{x (ms), y, label, rows: [[giá trị, nhãn]]}] · kind: "line" | "bar". */
function chartSVG(id, pts, { kind = "line", unit = "", ref = null, refLabel = "", fromZero = false } = {}) {
  const ys = pts.map(p => p.y).concat(ref != null ? [ref] : []);
  const sc = yScale(ys, fromZero || kind === "bar");
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x;
  const bw = kind === "bar" ? Math.min(24, (W - PL - PR) / pts.length - 2) : 0;
  const X = kind === "bar"
    ? i => PL + (i + 0.5) * (W - PL - PR) / pts.length
    : x => x1 === x0 ? (PL + W - PR) / 2 : PL + (x - x0) / (x1 - x0) * (W - PL - PR);
  const Y = v => PT + (1 - (v - sc.lo) / (sc.hi - sc.lo)) * (H - PT - PB);
  const px = pts.map((p, i) => kind === "bar" ? X(i) : X(p.x));
  const grid = sc.ticks.map(t => `<line x1="${PL}" x2="${W - PR}" y1="${Y(t)}" y2="${Y(t)}" class="cg"/>
    <text x="${PL - 6}" y="${Y(t) + 4}" text-anchor="end" class="ct">${fmtNum(t)}</text>`).join("");
  const xl = [0, pts.length - 1].filter((v, i, a) => a.indexOf(v) === i).map((i, k) =>
    `<text x="${px[i]}" y="${H - 8}" text-anchor="${pts.length === 1 ? "middle" : k ? "end" : "start"}" class="ct">${esc(pts[i].label)}</text>`).join("");
  const refLine = ref != null ? `<line x1="${PL}" x2="${W - PR}" y1="${Y(ref)}" y2="${Y(ref)}" class="cref"/>
    <text x="${W - PR}" y="${Y(ref) - 5}" text-anchor="end" class="ct">${esc(refLabel)}</text>` : "";

      // đầu cột bo 4px, chân cột vuông trên đường nền
      return h ? `<path class="cbar" d="M${px[i] - bw / 2},${base} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z"/>` : ""; }).join("");
  } else {
    const d = pts.map((p, i) => (i ? "L" : "M") + px[i].toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ");
    const last = pts.length - 1;
    marks = `<path class="cline" d="${d}"/>` + (pts.length <= 40 ? pts.map((p, i) =>
      `<circle class="cdot" cx="${px[i]}" cy="${Y(p.y)}" r="${i === last ? 5 : 3.5}"/>`).join("") : "")
      + `<text x="${Math.min(px[last], W - PR)}" y="${Y(pts[last].y) - 10}" text-anchor="${pts.length > 1 ? "end" : "middle"}" class="cval">${fmtNum(pts[last].y)}${unit ? " " + esc(unit) : ""}</text>`;
  }

    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ, ${pts.length} điểm, mới nhất ${fmtNum(pts[pts.length - 1].y)} ${esc(unit)}">
      ${grid}${refLine}${marks}${xl}
      <line class="cx" x1="0" x2="0" y1="${PT}" y2="${H - PB}" visibility="hidden"/>
      <rect class="chit" x="${PL - 8}" y="0" width="${W - PL - PR + 16}" height="${H}" tabindex="0"/>
    </svg><div class="ctip" hidden></div></div>`;
}
/** Bảng số liệu: đường ra số không cần chạm/rê. */

    <tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>

function chartTip(wrap, clientX) {
  const c = CHARTS[wrap.dataset.chart]; if (!c) return;
  const svg = wrap.querySelector("svg"), box = svg.getBoundingClientRect();
  const x = (clientX - box.left) / box.width * W;
  let i = 0; c.px.forEach((v, k) => { if (Math.abs(v - x) < Math.abs(c.px[i] - x)) i = k; });
  const p = c.pts[i], line = svg.querySelector(".cx"), tip = wrap.querySelector(".ctip");
  line.setAttribute("x1", c.px[i]); line.setAttribute("x2", c.px[i]); line.setAttribute("visibility", "visible");
  svg.querySelectorAll(".cdot.on, .cbar.on").forEach(n => n.classList.remove("on"));
  const mk = svg.querySelectorAll(".cdot, .cbar")[i]; if (mk) mk.classList.add("on");
  tip.replaceChildren();
  const h = document.createElement("div"); h.className = "small dim"; h.textContent = p.label; tip.append(h);
  p.rows.forEach(([v, lab]) => { const r = document.createElement("div");
    const b = document.createElement("b"); b.textContent = v; r.append(b, document.createTextNode(lab ? " " + lab : "")); tip.append(r); });
  tip.hidden = false;

}

// bàn phím: Tab vào biểu đồ, ← → đi từng điểm

  const i = Math.max(0, Math.min(c.pts.length - 1, cur + (e.key === "ArrowRight" ? 1 : -1))); w.dataset.i = i;
  const box = w.querySelector("svg").getBoundingClientRect(); chartTip(w, box.left + c.px[i] / W * box.width); e.preventDefault();

      : progMetric === "vol" ? "Tổng tạ × rep của bài trong buổi — tăng đều là đang tiến bộ dù tạ chưa lên."

/* ---------------- chạy trong app Android (Capacitor) ----------------
   Cùng một file index.html; khi được bọc trong android-app/ thì có thêm plugin gốc.
   Trên web các hàm dưới đây không làm gì. */

/** Xin quyền thông báo + tạo kênh "Đồng hồ nghỉ" (rung, kêu, hiện đè) một lần. */
function notifSetup() {
  const LN = plug("LocalNotifications");
  if (!LN) return Promise.resolve(false);
  return notifReady = notifReady || LN.requestPermissions()
    .then(r => r.display === "granted" && LN.createChannel({ id: "rest", name: "Đồng hồ nghỉ",
      description: "Báo khi hết giờ nghỉ giữa set", importance: 5, visibility: 1, vibration: true })
      .then(() => true))
    .catch(() => false);
}
/** Hết giờ nghỉ lúc app đang ẩn (tắt màn hình, mở app nhạc…) thì báo bằng thông báo hệ thống,
 *  vì khi ẩn trình duyệt dừng đồng hồ JS. App hiện lên lại thì huỷ để khỏi báo hai lần. */
async function restNotify() {
  const LN = plug("LocalNotifications");
  if (!LN) return;
  try {
    await LN.cancel({ notifications: [{ id: 1 }] });
    if (!restEnd || document.visibilityState === "visible" || restEnd <= Date.now() + 1000) return;
    if (!(await notifSetup())) return;
    const d = day(), ex = d && d.exercises[exIdx];
    await LN.schedule({ notifications: [{ id: 1, channelId: "rest", title: "Hết giờ nghỉ",
      body: ex ? "Vào set tiếp — " + eff(ex, curDate, d.id).name : "Vào set tiếp",
      schedule: { at: new Date(restEnd), allowWhileIdle: true } }] });
  } catch (e) { /* không có quyền — vẫn còn đồng hồ trong app */ }
}

const THEMES = [["auto", "Tự động", "Theo máy: Sáng ban ngày, Đêm khi máy để tối"],

  const t = resolveTheme(themePref()), root = document.documentElement;
  root.dataset.theme = t;
  try { localStorage.setItem("gymbook.theme", themePref()); } catch (e) {}

  for (let i = 1; i <= 7; i++) { const x = addDays(d, -i); if (foodDay(x).length) days.push(foodTotals(x)); }
  if (!days.length) return null;
  return { n: days.length, kcal: days.reduce((a, t) => a + t.kcal, 0) / days.length, p: days.reduce((a, t) => a + t.p, 0) / days.length };
}
function addFood(e) {
  if (!S.food) S.food = {};

  save(true);
}
/** Số lượng đang chọn → kcal/đạm. Theo gam thì tính theo tỉ lệ gam / gam mỗi đơn vị. */
function selCalc() {
  const f = FOODS[foodSel.i], k = foodSel.gram ? (+foodSel.g || 0) / f[3] : foodSel.q;
  return { kcal: Math.round(f[4] * k), p: n1(f[5] * k),

    ${goal ? `<div class="bar" style="margin-top:6px"><i style="width:${pct}%;${val >= goal ? "background:var(--jade)" : ""}"></i></div>` : ""}</div>`;
}
function foodRow(i) {

function foodResults() {
  const toks = unaccent(foodQ).split(/\s+/).filter(Boolean);
  const hits = FOODS.map((f, i) => i).filter(i => (!foodGroup || FOODS[i][1] === foodGroup)
    && toks.every(t => FOOD_IDX[i].includes(t)));
  if (!toks.length && !foodGroup) return `<p class="small dim" style="margin:10px 2px 0">Gõ tên món (không dấu cũng được) hoặc chọn một nhóm.</p>`;

/** Chạm ô tìm: cuộn cho ô tìm lên sát thanh trên cùng, kết quả hiện ngay trên bàn phím.
 *  Chờ bàn phím mở xong (màn hình co lại) rồi mới cuộn. */
function scrollSearchUp() {
  const el = $("#foodQ"); if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - $("#topbar").offsetHeight - 8;
  window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}
// Đang tìm thì giữ chỗ cho vùng kết quả (70% màn hình) — trang đủ dài để cuộn ô tìm lên,
// danh sách ngắn cũng không bị kẹt dưới bàn phím.
const searching = on => { const r = $("#foodResults"); if (r) r.style.minHeight = on ? "70vh" : ""; };
// Đang gõ tìm thì ẩn thanh tab dưới cùng: bàn phím đã chiếm nửa màn hình, nhường chỗ cho kết quả.
document.addEventListener("focusin", e => { if (e.target.id === "foodQ") {
  searching(true); document.body.classList.add("typing"); setTimeout(scrollSearchUp, 300); } });
document.addEventListener("focusout", e => { if (e.target.id === "foodQ") {
  document.body.classList.remove("typing"); if (!foodQ && !foodGroup) searching(false); } });
/* Bữa nhiều món: gom từng món vào khay rồi ghi một dòng (chi tiết nằm trong items).
   Khay lưu trong S.tray nên chuyển app, tắt màn hình giữa chừng cũng không mất. */
const tray = () => S.tray || (S.tray = []);
const sumItems = items => items.reduce((a, x) => ({ kcal: a.kcal + (+x.kcal || 0), p: a.p + (+x.p || 0) }), { kcal: 0, p: 0 });
function mealName() {
  const h = new Date().getHours();
  return foodDate !== today() ? "Bữa ăn" : h < 10 ? "Bữa sáng" : h < 14 ? "Bữa trưa" : h < 17 ? "Bữa phụ" : "Bữa tối";
}
function itemsList(items) {
  if (!items || !items.length) return "";
  return `<details class="note" style="margin-top:2px"><summary>${items.length} món</summary><ul>${items.map(x =>
    `<li>${esc(x.name)}${x.q ? " · " + esc(x.q) : ""} — ${Math.round(x.kcal)} kcal · ${Math.round(x.p)} g</li>`).join("")}</ul></details>`;
}
function trayCard() {
  const t = tray(); if (!t.length) return "";
  const sum = sumItems(t);
  return `<div class="card" id="tray" style="margin-top:20px">
    <div class="spread"><div class="tiny" style="color:var(--brass)">Bữa đang gộp · ${t.length} món</div>
      <button class="ghost sm" data-trayclear="1" style="min-height:34px;padding:4px 12px">Xoá hết</button></div>
    ${t.map((x, i) => `<div class="lrow" style="padding:10px 0">
      <div style="min-width:0">${esc(x.name)}<span class="small dim" style="display:block">${esc(x.q || "")}</span></div>
      <div class="row" style="gap:8px"><span class="num muted" style="white-space:nowrap">${Math.round(x.kcal)} kcal · ${Math.round(x.p)} g</span>
        <button class="iconbtn" data-traydel="${i}" aria-label="Bỏ ${esc(x.name)} khỏi bữa">×</button></div></div>`).join("")}
    <div class="spread" style="margin:12px 0"><b>Tổng</b>
      <span class="num" style="font-size:20px">${Math.round(sum.kcal).toLocaleString("vi-VN")} kcal · ${Math.round(sum.p)} g đạm</span></div>
    <label class="f"><span>Tên bữa</span><input id="trayName" value="${esc(mealName())}"></label>
    <label class="row small muted" style="gap:9px;margin-top:12px;cursor:pointer">
      <input type="checkbox" id="trayFav" style="width:20px;height:20px;min-height:20px;padding:0;flex:none;accent-color:var(--brass)">
      Lưu thành món quen — lần sau ăn y vậy thì bấm một lần</label>
    <button class="btn" data-traylog="1" style="margin-top:12px">Ghi bữa này</button></div>`;
}
function toTray(x) {
  tray().push(x); save(true); foodSel = null; foodQ = ""; foodGroup = ""; showCustom = false; render();
  const el = $("#tray");
  if (el) window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - $("#topbar").offsetHeight - 8) });
  toast(`Đã thêm ${x.name} vào bữa · ${tray().length} món`);
}
/** Chỉ vẽ lại danh sách kết quả khi gõ tìm, để ô tìm không mất con trỏ. */
function refreshFoodResults() { const el = $("#foodResults"); if (el) el.innerHTML = foodResults(); }
function refreshSel() {
  if (!foodSel) return;
  const c = selCalc(), a = $("#foodCalc"), b = $("#foodQtxt");
  if (a) a.textContent = `${c.kcal} kcal · ${Math.round(c.p)} g đạm`;
  if (b) b.textContent = c.q;
}
function foodClick(el) {
  if (el.dataset.fday) {
    const nd = addDays(foodDate, +el.dataset.fday);
    if (nd > today()) return true;
    foodDate = nd; foodSel = null; render(); return true;
  }
  if (el.dataset.fav) {
    const f = favs().find(x => x.id === el.dataset.fav); if (!f) return true;
    addFood({ name: f.name, kcal: f.kcal, p: f.p, q: f.q || "", ...(f.items ? { items: f.items } : {}) });
    render(); toast("Đã ghi " + f.name); return true;
  }
  if (el.dataset.favedit) { favEdit = !favEdit; render(); return true; }
  if (el.dataset.favdel) { S.favs = favs().filter(x => x.id !== el.dataset.favdel); save(true); render(); return true; }
  if (el.dataset.fgroup) {
    foodGroup = foodGroup === el.dataset.fgroup ? "" : el.dataset.fgroup; foodSel = null;
    const x = document.querySelector(".chips.scroll"), sx = x ? x.scrollLeft : 0;
    render(); const y = document.querySelector(".chips.scroll"); if (y) y.scrollLeft = sx;  // giữ vị trí hàng nút
    if (foodGroup) scrollSearchUp(); return true;
  }
  if (el.dataset.food !== undefined) {
    const i = +el.dataset.food;
    // món ghi theo "100 g" thì mở sẵn ô gam — cân thịt, cá thì nhập gam tiện hơn
    foodSel = foodSel && foodSel.i === i ? null : { i, q: 1, gram: /^\d+ g$/.test(FOODS[i][2]), g: FOODS[i][3] || "" };
    refreshFoodResults(); return true;
  }
  if (el.dataset.fmode) { foodSel.gram = el.dataset.fmode === "g"; refreshFoodResults(); return true; }
  if (el.dataset.fqset) { foodSel.q = +el.dataset.fqset; refreshFoodResults(); return true; }
  if (el.dataset.fq) { foodSel.q = Math.max(0.5, foodSel.q + +el.dataset.fq); refreshFoodResults(); return true; }
  if (el.dataset.addsel || el.dataset.favsel) {
    const c = selCalc(), name = FOODS[foodSel.i][0];
    if (!(c.kcal > 0 || c.p > 0)) { toast("Nhập số lượng đã"); return true; }
    if (el.dataset.favsel) {
      favs().push({ id: uid(), name: name + " · " + c.q, kcal: c.kcal, p: c.p, q: c.q }); save(true);
      render(); toast("Đã lưu món quen"); return true;
    }
    addFood({ name, kcal: c.kcal, p: c.p, q: c.q }); foodSel = null; render(); toast(`Đã ghi ${name} · ${c.kcal} kcal`); return true;
  }
  if (el.dataset.totray) {
    const c = selCalc();
    if (!(c.kcal > 0 || c.p > 0)) { toast("Nhập số lượng đã"); return true; }
    toTray({ name: FOODS[foodSel.i][0], q: c.q, kcal: c.kcal, p: c.p }); return true;
  }
  if (el.dataset.customtray) {
    const name = $("#cName").value.trim(), kcal = Math.round(+$("#cKcal").value || 0), p = n1(+$("#cP").value || 0);
    if (!name || !(kcal > 0 || p > 0)) { toast("Nhập tên và calo hoặc đạm"); return true; }
    toTray({ name, q: "", kcal, p }); return true;
  }
  if (el.dataset.traydel !== undefined) { tray().splice(+el.dataset.traydel, 1); save(true); render(); return true; }
  if (el.dataset.trayclear) { S.tray = []; save(true); render(); return true; }
  if (el.dataset.traylog) {
    const items = tray().slice(), sum = sumItems(items), name = $("#trayName").value.trim() || mealName();
    const e = { name, kcal: Math.round(sum.kcal), p: n1(sum.p), q: items.length + " món", items };
    addFood(e);
    if ($("#trayFav").checked) favs().push({ id: uid(), name, kcal: e.kcal, p: e.p, q: e.q, items });
    S.tray = []; save(true); render(); toast(`Đã ghi ${name} · ${e.kcal} kcal`); return true;
  }
  if (el.dataset.custom) { showCustom = el.dataset.custom === "1"; render(); if (showCustom) $("#cName").focus(); return true; }
  if (el.dataset.addcustom) {
    const name = $("#cName").value.trim(), kcal = Math.round(+$("#cKcal").value || 0), p = n1(+$("#cP").value || 0);
    if (!name || !(kcal > 0 || p > 0)) { toast("Nhập tên và calo hoặc đạm"); return true; }
    addFood({ name, kcal, p, q: "" });
    if ($("#cFav").checked) favs().push({ id: uid(), name, kcal, p });
    showCustom = false; save(true); render(); toast("Đã ghi " + name); return true;
  }
  if (el.dataset.fdel) {
    const arr = foodDay(foodDate), e = arr.find(x => x.id === el.dataset.fdel); if (!e) return true;
    S.food[foodDate] = arr.filter(x => x !== e);
    if (!S.food[foodDate].length) delete S.food[foodDate];
    save(true); render(); toast("Đã xoá " + e.name); return true;
  }
  return false;
}

/** Ngày bắt đầu không phải thứ Hai thì tuần giáo án lệch tuần lịch — gợi ý lùi về thứ Hai. */
function startHint(start) {
  const x = new Date(start + "T00:00:00");
  if (isNaN(x) || x.getDay() === 1) return "";
  const mon = mondayOf(start);
  return `<div class="small muted" style="margin-top:-2px">Ngày này là ${THU[x.getDay()]}, nên mỗi tuần giáo án chạy từ ${THU[x.getDay()]} tới ${THU[(x.getDay() + 6) % 7]}.
    <button class="ghost sm" data-snapmon="${mon}" style="width:100%;margin-top:8px">Lùi về thứ Hai ${fmtDate(mon)} cho khớp lịch</button></div>`;
}
/** pick: màn thiết lập đầu — không có "Đang dùng", bấm là chọn luôn. */
function tplCards(pick) {

/** Nhịp tăng cân từ lần cân mới nhất so với lần cân cách đó 1–3 tuần (bw xếp mới → cũ). */
/* Mục tiêu suy ra từ mức chênh calo (dữ liệu cũ không có trường riêng):
   dương = tăng cơ, âm = giảm mỡ, quanh 0 = giữ cân. Chọn mục tiêu thì đặt sẵn mức chênh. */
const GOALS = [["tang", "Tăng cơ, tăng cân", 300], ["giu", "Giữ cân, tăng sức", 0], ["giam", "Giảm mỡ", -400]];
const goalOf = p => (+p.surplus || 0) > 100 ? "tang" : (+p.surplus || 0) < -100 ? "giam" : "giu";
/** Nhịp cân mỗi tuần theo mục tiêu: [thấp, cao] kg/tuần là đúng nhịp. */
const PACE = { tang: [0.1, 0.6, "0,25–0,5"], giu: [-0.2, 0.2, "−0,2 đến +0,2"], giam: [-1, -0.1, "−0,25 đến −0,75"] };
function gainPace(bw) {
  const last = bw[0], gap = e => (new Date(last.date) - new Date(e.date)) / 864e5;
  const base = last && bw.filter(e => gap(e) >= 7 && gap(e) <= 21).pop();
  if (!base) return `<p class="small muted" style="margin:14px 0 0">Cân 1–2 lần mỗi tuần. Có số liệu cách nhau từ 1 tuần, app sẽ cho biết có cần chỉnh cách ăn không.</p>`;
  const rate = n1((last.kg - base.kg) / gap(base) * 7), goal = goalOf(S.profile), [lo, hi, band] = PACE[goal];
  const low = rate < lo, high = rate > hi;
  const [color, msg] = low
    ? goal === "giam" ? ["var(--brass)", "Giảm nhanh quá, dễ mất cơ — ăn thêm khoảng 200 kcal mỗi ngày."]
      : ["var(--rust)", goal === "tang" ? "Chậm quá — thêm 200–300 kcal mỗi ngày (một bữa phụ nhỏ: sữa, chuối, bơ đậu phộng)."
        : "Đang sụt cân — thêm 150–200 kcal mỗi ngày."]
    : high
    ? goal === "tang" ? ["var(--brass)", "Hơi nhanh, dễ tích mỡ — bớt 150–200 kcal mỗi ngày."]
      : ["var(--rust)", goal === "giam" ? "Chưa giảm — bớt 200–300 kcal mỗi ngày, ưu tiên giữ đủ đạm."
        : "Đang lên cân — bớt 150–200 kcal mỗi ngày."]
    : ["var(--jade)", "Đúng nhịp — giữ nguyên cách ăn."];
  const adj = low ? (goal === "tang" ? 250 : 200) : high ? (goal === "giam" ? -250 : -150) : 0;
  const avg = foodAvg(addDays(today(), 1));
  const ate = avg && avg.n >= 3 ? `<div class="small muted" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
      7 ngày qua ăn trung bình <b style="color:var(--chalk)">${Math.round(avg.kcal).toLocaleString("vi-VN")} kcal</b> (${avg.n} ngày có ghi)${
      adj ? ` → nhắm khoảng <b style="color:var(--chalk)">${(Math.round((avg.kcal + adj) / 50) * 50).toLocaleString("vi-VN")} kcal</b>.`
      : " — đây là mức ăn hợp với bạn, tin số này hơn con số tính theo công thức."}</div>` : "";
  return `<div class="card" style="margin-top:14px;border-color:${color}">
    <div class="num" style="font-size:22px;color:${color}">${rate > 0 ? "+" : ""}${rate} kg/tuần</div>
    <div class="small muted">${msg} Nhịp hợp với mục tiêu: ${band} kg/tuần.</div>${ate}</div>`;
}

    </div></details>

    ${dataSec()}

}
const importInput = () => `<input type="file" id="importFile"${NATIVE ? "" : ' accept="application/json,.json"'} hidden>`;
function dataSec() {

      <p class="small muted" style="margin:14px 0">Mọi thứ nằm trong ${NATIVE ? "app trên máy này. Gỡ app là mất" : "trình duyệt máy này. Xoá dữ liệu duyệt web là mất"} — xuất file định kỳ.</p>
      <div class="stack">
        <button class="ghost" id="exportBtn">⬇ Xuất file JSON</button>
        <button class="ghost" id="importBtn">⬆ Nhập từ file JSON</button>
        ${importInput()}
        <button class="ghost danger" id="resetBtn">Khôi phục giáo án gốc</button>
      </div>
    </div></details>`;
}

/* ---------------- màn hình chào (người mới) ----------------
   Chưa thiết lập thì không vào thẳng tab Tập: chọn nhập dữ liệu cũ, hoặc điền hồ sơ
   (bỏ qua được) rồi chọn giáo án. Chọn xong giáo án mới tính là thiết lập xong. */
let onbStep = "welcome";
function viewSetup() {
  if (onbStep === "profile") return `
    <div class="tiny dim" style="margin-top:4px">Bước 1 / 2</div>
    <h2>Hồ sơ</h2>
